<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <h1>QuickNotes</h1>
    <p class="subtitle">API client practice with JSONPlaceholder</p>

    <button id="load-btn" type="button">Load notes</button>

    <p id="status" role="status" aria-live="polite"></p>

    <form id="note-form" novalidate>
      <div class="field">
        <label for="title-input">Title (required, max 100 characters)</label>
        <input id="title-input" name="title" type="text" autocomplete="off">
      </div>

      <div class="field">
        <label for="body-input">Available Notes.</label>
        <textarea id="body-input" name="body" rows="4"></textarea>
      </div>

      <button id="submit-btn" type="submit">Add note</button>
    </form>

    <ul id="notes-list"></ul>
  </main>
</body>
</html>
